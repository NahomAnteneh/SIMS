services:
  postgres:
    image: postgres:18.6-alpine@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66
    container_name: sims-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: sims
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../db/bootstrap_roles.sql:/docker-entrypoint-initdb.d/01_bootstrap_roles.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sims"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migration
    container_name: sims-migration
    environment:
      GOOSE_DBSTRING: "postgres://postgres:postgres@postgres:5432/sims?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  vcsim:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.vcsim
    container_name: sims-vcsim
    ports:
      - "8989:8989"

  prometheus:
    image: prom/prometheus:v3.13.4@sha256:2b23972d85f7f1350cde18fb61239d6fc8669a5b8fe162ab569373d3ad3463d2
    container_name: sims-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.0.10@sha256:c8b898f70a9860c538761af0a9f79da6b38f4fca2873ac48ce14df2a4ae21252
    container_name: sims-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.collector
    container_name: sims-collector
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      LOG_LEVEL: "debug"
      VCENTER_URL: "https://vcsim:8989/sdk"
      VCENTER_USER: "user"
      VCENTER_PASSWORD: "pass"
      VCENTER_INSECURE: "true"
      DATABASE_URL: "postgres://sims:${POSTGRES_PASSWORD:-sims_password}@postgres:5432/sims?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      vcsim:
        condition: service_started

  query-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.query-api
    container_name: sims-query-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "debug"
      DATABASE_URL: "postgres://sims:${POSTGRES_PASSWORD:-sims_password}@postgres:5432/sims?sslmode=disable"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
    container_name: sims-web
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      INTERNAL_QUERY_API_URL: "http://query-api:8080"
      QUERY_API_URL: "http://query-api:8080"
    depends_on:
      - query-api

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

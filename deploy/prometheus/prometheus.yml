global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "sims-collector"
    metrics_path: /metrics
    static_configs:
      - targets: ["collector:8081"]

  - job_name: "sims-query-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["query-api:8080"]

openapi: 3.1.0
info:
  title: Distributed vSphere Inventory & Search Platform API
  description: >
    Query API for distributed vSphere inventory, full-text search,
    topology traversal, authentication, and vCenter management.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Returns 200 if the process is running.
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      summary: Readiness probe
      description: Returns 200 if the service has verified downstream dependencies and can serve requests.
      operationId: getReadiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      summary: Prometheus metrics
      description: Returns Prometheus format telemetry metrics.
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string

  /v1/search/vms:
    get:
      summary: Quick search virtual machines
      description: Fast classified search across VM names, UUIDs, MoRefs, IP addresses, MAC addresses, and hostnames.
      operationId: quickSearchVMs
      parameters:
        - name: q
          in: query
          required: true
          description: Raw search input
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return (1-100, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Keyset pagination cursor
          schema:
            type: string
      responses:
        "200":
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchVMsResponse"
        "400":
          description: Invalid query parameter or cursor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/vms/search:
    post:
      summary: Structured filter VM search
      description: Recursive typed AST filter query with keyset pagination and sorting.
      operationId: searchVMsStructured
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchVMsRequest"
      responses:
        "200":
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchVMsResponse"
        "400":
          description: Invalid filter AST, unknown field or incompatible operator
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/vms:
    get:
      summary: List virtual machines
      description: Returns a paginated list of virtual machines ordered by (name ASC, id ASC) using keyset pagination.
      operationId: listVMs
      parameters:
        - name: vcenter_id
          in: query
          required: false
          description: Filter virtual machines by vCenter UUID
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          required: false
          description: Substring match filter on virtual machine name
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return (1-100, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque base64-encoded keyset pagination cursor
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of virtual machines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVMsResponse"
        "400":
          description: Invalid request parameters or malformed cursor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/vms/{id}:
    get:
      summary: Get virtual machine details
      description: Retrieves complete details of a single virtual machine by internal UUID, including attached datastores, network interfaces, tags, and custom attributes.
      operationId: getVM
      parameters:
        - name: id
          in: path
          required: true
          description: Virtual machine internal UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detailed virtual machine record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMDetailResponse"
        "400":
          description: Invalid UUID format
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Virtual machine not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/vms/facets:
    get:
      summary: Aggregated facet counts
      description: Returns distinct attribute counts within the caller's authorization scope.
      operationId: getVMFacets
      parameters:
        - name: fields
          in: query
          required: false
          description: Comma-separated list of facet fields (power_state, cluster, host, datastore, vcenter, tag)
          schema:
            type: string
            example: "power_state,cluster,datacenter"
        - name: limit
          in: query
          required: false
          description: Maximum distinct buckets per field
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Facet distributions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacetsResponse"
        "400":
          description: Unknown facet field
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/meta/vm-fields:
    get:
      summary: Filterable and sortable fields metadata
      description: Returns allowable filter and sort fields, their types, and supported operators.
      operationId: getVMFieldsMetadata
      responses:
        "200":
          description: Metadata catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMFieldsMetadataResponse"

  /v1/tags:
    get:
      summary: List inventory tags
      description: Returns tag categories and tags with VM counts.
      operationId: listTags
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tag catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"

  /v1/custom-attributes:
    get:
      summary: List inventory custom attributes
      description: Returns attribute names and bounded distinct values with VM counts.
      operationId: listCustomAttributes
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Custom attribute catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomAttributeListResponse"

  /v1/datacenters:
    get:
      summary: List datacenters
      operationId: listDatacenters
      responses:
        "200":
          description: List of datacenters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyListResponse"

  /v1/datacenters/{id}:
    get:
      summary: Get datacenter by ID
      operationId: getDatacenter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Datacenter details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyItem"
        "404":
          description: Datacenter not found

  /v1/datacenters/{id}/vms:
    get:
      summary: List VMs in datacenter
      operationId: listDatacenterVMs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: VMs in datacenter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVMsResponse"

  /v1/clusters:
    get:
      summary: List clusters
      operationId: listClusters
      responses:
        "200":
          description: List of clusters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyListResponse"

  /v1/clusters/{id}:
    get:
      summary: Get cluster by ID
      operationId: getCluster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cluster details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyItem"

  /v1/clusters/{id}/vms:
    get:
      summary: List VMs in cluster
      operationId: listClusterVMs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: VMs in cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVMsResponse"

  /v1/hosts:
    get:
      summary: List ESXi hosts
      operationId: listHosts
      responses:
        "200":
          description: List of hosts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyListResponse"

  /v1/hosts/{id}:
    get:
      summary: Get host by ID
      operationId: getHost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Host details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyItem"

  /v1/hosts/{id}/vms:
    get:
      summary: List VMs on host
      operationId: listHostVMs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: VMs on host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVMsResponse"

  /v1/datastores:
    get:
      summary: List datastores
      operationId: listDatastores
      responses:
        "200":
          description: List of datastores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyListResponse"

  /v1/datastores/{id}:
    get:
      summary: Get datastore by ID
      operationId: getDatastore
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Datastore details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyItem"

  /v1/datastores/{id}/vms:
    get:
      summary: List VMs on datastore
      operationId: listDatastoreVMs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: VMs on datastore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVMsResponse"

  /v1/networks:
    get:
      summary: List networks and portgroups
      operationId: listNetworks
      responses:
        "200":
          description: List of networks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyListResponse"

  /v1/networks/{id}:
    get:
      summary: Get network by ID
      operationId: getNetwork
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Network details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyItem"

  /v1/networks/{id}/vms:
    get:
      summary: List VMs attached to network
      operationId: listNetworkVMs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: VMs attached to network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVMsResponse"

  /v1/folders:
    get:
      summary: Browse inventory folders
      operationId: listFolders
      parameters:
        - name: parent_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Folder tree list with VM counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListResponse"

  /v1/folders/{id}:
    get:
      summary: Get folder by ID
      operationId: getFolder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Folder details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderItem"

  /v1/folders/{id}/vms:
    get:
      summary: List VMs in folder
      operationId: listFolderVMs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: VMs in folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVMsResponse"

  /v1/auth/login:
    post:
      summary: Local user authentication
      description: Authenticate with username and password to obtain an HS256 Bearer JWT token.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Malformed request payload
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Invalid username or password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/users:
    get:
      summary: List provisioned users
      description: Returns a list of provisioned users. Requires admin role.
      operationId: listUsers
      responses:
        "200":
          description: List of provisioned users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Insufficient privileges (requires admin)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      summary: Create a new user
      description: Provisions a new local user with specified role and optional tenant scoping. Requires admin role.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error or weak password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Insufficient privileges
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Username already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/users/{id}:
    get:
      summary: Get user details
      description: Retrieve details for a specific user. Requires admin role.
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          description: User unique identifier (UUID)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Insufficient privileges
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      summary: Update user password or metadata
      description: Updates credentials for an existing user. Requires admin role.
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          description: User unique identifier (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Insufficient privileges
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Delete user
      description: Deletes an existing user account. Requires admin role. Self-deletion is prevented.
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          description: User unique identifier (UUID)
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User deleted successfully
        "400":
          description: Cannot delete own user account
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Insufficient privileges
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/me:
    get:
      summary: Caller identity and authorization scope
      operationId: getCallerIdentity
      responses:
        "200":
          description: Caller identity profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /v1/vcenters:
    get:
      summary: List registered vCenters
      operationId: listVCenters
      responses:
        "200":
          description: List of vCenters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VCenterListResponse"
    post:
      summary: Register a new vCenter
      operationId: createVCenter
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVCenterRequest"
      responses:
        "201":
          description: vCenter registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VCenterResponse"
        "400":
          description: Invalid request or validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: vCenter host already registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/vcenters/test-connection:
    post:
      summary: Test vCenter connectivity without registering
      operationId: testVCenterConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestConnectionRequest"
      responses:
        "200":
          description: Connection validated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"
        "400":
          description: Connection or validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/vcenters/{id}:
    get:
      summary: Get vCenter by ID
      operationId: getVCenter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: vCenter record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VCenterResponse"
        "404":
          description: vCenter not found
    patch:
      summary: Update vCenter configuration or credentials
      operationId: updateVCenter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVCenterRequest"
      responses:
        "200":
          description: vCenter updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VCenterResponse"
    delete:
      summary: Decommission and tombstone vCenter inventory
      operationId: deleteVCenter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: vCenter decommissioned

  /v1/vcenters/{id}/resync:
    post:
      summary: Request full inventory resynchronization
      operationId: resyncVCenter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Resync accepted

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - service
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
          example: "2026-10-02T08:00:00Z"
        service:
          type: string
          example: query-api
        version:
          type: string
          example: "1.0.0"
        details:
          type: object
          additionalProperties: true

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: "about:blank"
        title:
          type: string
          example: "Bad Request"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Invalid filter specification"
        instance:
          type: string
          example: "/v1/vms/search"
        code:
          type: integer
          example: 400
        error_code:
          type: string
          example: "invalid_filter"
        invalid_params:
          type: array
          items:
            type: object
